name: 构建 APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: 运行测试并构建 Release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: codex-hook-toolbox-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
