name: 构建 APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装并校验 MCP 服务
        run: |
          npm ci
          npm run test:mcp
      - name: 准备固定 Release 签名
        env:
          CODEX_KEYSTORE_BASE64: ${{ secrets.CODEX_KEYSTORE_BASE64 }}
        run: printf '%s' "$CODEX_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
      - name: 运行测试并构建 Release APK
        env:
          CODEX_KEYSTORE_PATH: release.keystore
          CODEX_KEYSTORE_PASSWORD: ${{ secrets.CODEX_KEYSTORE_PASSWORD }}
          CODEX_KEY_ALIAS: ${{ secrets.CODEX_KEY_ALIAS }}
          CODEX_KEY_PASSWORD: ${{ secrets.CODEX_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: codex-hook-toolbox-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
