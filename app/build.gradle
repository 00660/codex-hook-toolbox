plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.hooktoolbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codex.hooktoolbox'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.0.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('CODEX_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('CODEX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CODEX_KEY_ALIAS')
                keyPassword System.getenv('CODEX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        validation {
            initWith release
            applicationIdSuffix '.validation'
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    implementation 'org.brotli:dec:0.1.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
